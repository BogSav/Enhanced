name: enhanced

services:
  # -------- DEV PROFILE --------
  web-dev:
    profiles: ["dev"]
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    environment:
      # variabile vizibile în Vite trebuie să înceapă cu VITE_
      VITE_API_BASE_URL: "http://localhost:8080"
      CHOKIDAR_USEPOLLING: "1"
      CHOKIDAR_INTERVAL: "100"
    env_file:
      - ./apps/web/.env.local
    volumes:
      - ./apps/web/public:/app/public:ro
      - ./apps/web/src:/app/src:ro
      - ./apps/web/index.html:/app/index.html:ro
      # adaugă manifest + lockfile cu rw
      - ./apps/web/package.json:/app/package.json
      - ./apps/web/package-lock.json:/app/package-lock.json
    ports:
      - "5173:5173"

  # -------- PROD PROFILE --------
  web:
    profiles: ["prod"]
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "80:80"
    restart: unless-stopped
