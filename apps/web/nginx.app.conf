server {
  listen 80;
  server_name _;

  # --- Limits/size/timeouts la nivel server ---
  client_max_body_size 10m;      # upload max (ajustează după caz)
  send_timeout 30s;

  # --- Rădăcină static (build Vite/React copiat în imagine) ---
  root  /usr/share/nginx/html;
  index index.html;

# Hashed assets (ex: app-0a1b2c3d.js)
  location ~* .(js|css)$ {
    expires 365d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
    access_log off;
  }

  # Imagini / fonturi etc.
  location ~* .(png|ico|gif|jpg|jpeg|css|js)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
    access_log off;
  }

  # --- SPA fallback pentru rute client-side ---
  location / {
    try_files $uri /index.html;
  }

  # --- Healthcheck simplu (200 OK) ---
  location = /healthz {
    return 200 'OK';
    add_header Content-Type text/plain;
  }

  # --- Security headers utile (TLS e la edge pe Render; le păstrăm oricum) ---
  add_header X-Content-Type-Options "nosniff"                always;
  add_header X-Frame-Options        "SAMEORIGIN"             always;
  add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy     "geolocation=(), microphone=()"   always;

  # Content-Security-Policy trebuie ADAPTAT aplicației tale (script-src/style-src etc.)
  # add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'" always;

  # (Dacă ai nevoie de CORS la edge-ul NGINX, configurează-l aici pe /api,
  #  dar ideal rămâi pe un singur origin și nu ai nevoie.)
}
