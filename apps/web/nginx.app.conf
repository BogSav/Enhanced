server {
  listen 80;
  server_name _;  # Wildcard (container / internal usage). Replace with hostname in deployment.

  # ---------------- Request Limits / Timeouts ----------------
  client_max_body_size 10m;   # Upper bound for uploads (increase if large assets needed)
  send_timeout 30s;           # Abort slow clients after inactivity during response send

  # ---------------- Static Root (Built React/Vite output) ----------------
  root  /usr/share/nginx/html;
  index index.html;

  # ---------------- Active Connection Limits (Enforcement) ----------------
  # Zones defined in base nginx.conf. These guard against abusive parallel
  # connection floods without affecting normal browsing.
  # per IP: up to 40 concurrent connections (static + future API mixed)
  # whole server: cap aggregate at 800 (adjust to expected traffic footprint)
  limit_conn perip 40;
  limit_conn perserver 800;

  # Long-lived immutable hashed assets (e.g. app-<hash>.js / style-<hash>.css)
  location ~* \.(?:js|css)$ {
    expires 365d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
    access_log off;
  }

  # Medium cache static assets (images, icons, fonts, duplicate js|css pattern safe)
  location ~* \.(?:png|ico|gif|jpg|jpeg|css|js)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000"; # 30 days
    try_files $uri =404;
    access_log off;
  }

  # ---------------- SPA Fallback ----------------
  # Any non-file path falls back to index.html so client-side routing can handle it.
  location / {
    try_files $uri /index.html;
  }

  # ---------------- API Rate Limiting (Placeholder) ----------------
  # When backend routes are introduced under /api/ this will throttle bursts.
  # 'burst' allows short spikes above the base rate without immediate 429s.
  # Remove the 'nodelay' token to smooth spikes instead of rejecting.
  location /api/ {
    limit_req zone=api_rate burst=30 nodelay;
    # proxy_pass http://api-upstream;   # (to be defined when API exists)
    # add_header X-RateLimit-Limit 25 always;   # Optional custom headers
    # add_header X-RateLimit-Policy "25r/s; burst=30" always;
    return 204;  # Temporary placeholder until upstream service is integrated
  }

  # ---------------- Health Check ----------------
  location = /healthz {
    return 200 'OK';
    add_header Content-Type text/plain;
  }

  # ---------------- Security Headers (Baseline) ----------------
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options        "SAMEORIGIN" always;
  add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy     "geolocation=(), microphone=()" always;

  # Content-Security-Policy: customize for script/style sources, fonts, external APIs, etc.
  # Example (tight baseline – uncomment & adapt):
  # add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'" always;

  # CORS: Prefer serving everything from a single origin; only enable if an external client needs access.
  # Example skeleton (not active):
  # location /api/ {
  #   add_header Access-Control-Allow-Origin "https://example.com";
  #   add_header Access-Control-Allow-Methods "GET,POST,OPTIONS";
  #   add_header Access-Control-Allow-Headers "Authorization,Content-Type";
  #   if ($request_method = OPTIONS) { return 204; }
  # }
}
