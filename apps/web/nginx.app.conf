# --- Upstream (load balancing) ---
# Pune aici toate instanțele backend-ului. În Docker Compose/K8s, folosește hostname-urile lor.
upstream backend_app {
  least_conn;              # alternativ: round-robin (implicit), ip_hash etc.
  keepalive 64;            # conexiuni keep-alive către backend

  # Exemple:
  server api:3000          max_fails=3 fail_timeout=10s;
  # server api-2:3000      max_fails=3 fail_timeout=10s;
  # server api-3:3000      max_fails=3 fail_timeout=10s;
}

server {
  listen 80;
  server_name _;

  # --- Limits/size/timeouts la nivel server ---
  client_max_body_size 10m;      # upload max (ajustează după caz)
  send_timeout 30s;

  # --- Rădăcină static (build Vite/React copiat în imagine) ---
  root  /usr/share/nginx/html;
  index index.html;

# Hashed assets (ex: app-0a1b2c3d.js)
  location ~* .(js|css)$ {
    expires 365d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
    access_log off;
  }

  # Imagini / fonturi etc.
  location ~* .(png|ico|gif|jpg|jpeg|css|js)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
    access_log off;
  }

  # --- API: reverse proxy + rate limiting + conn limiting + timeouts ---
  location /api/ {
    # Rate limit: 10 r/s per IP cu burst 20 (ajustează la nevoi)
    limit_req zone=api_rate burst=20 nodelay;

    # Limit conexiuni concurente: max 20 per IP, 200 per server (exemplu)
    limit_conn perip 20;
    limit_conn perserver 200;

    proxy_http_version 1.1;

    # Antete forward standard (edge → nginx → backend)
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header Connection         "";

    # Timeouts rezonabile
    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    # Retry pe erori tranzitorii
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;

    # Buffering (reduce „choppiness”; ajustează dimensiunile la payload-urile tale)
    proxy_buffering on;
    proxy_buffers 16 16k;
    proxy_busy_buffers_size 24k;

    # (OPȚIONAL) micro-cache pt GET/HEAD (dezactivează dacă ai răspunsuri sensibile/dinamice)
    # proxy_cache           api_cache;
    # proxy_cache_methods   GET HEAD;
    # proxy_cache_valid     200 1s;     # „1s micro-cache” poate dubla throughput-ul pentru spike-uri
    # add_header X-Cache-Status $upstream_cache_status always;

    # SLASH-ul final CONTEAZĂ:
    # Cu „/” final taie prefixul /api ( /api/users -> /users )
    proxy_pass http://backend_app/;
  }

  # --- SPA fallback pentru rute client-side ---
  location / {
    try_files $uri /index.html;
  }

  # --- Healthcheck simplu (200 OK) ---
  location = /healthz {
    return 200 'OK';
    add_header Content-Type text/plain;
  }

  # --- Security headers utile (TLS e la edge pe Render; le păstrăm oricum) ---
  add_header X-Content-Type-Options "nosniff"                always;
  add_header X-Frame-Options        "SAMEORIGIN"             always;
  add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy     "geolocation=(), microphone=()"   always;

  # Content-Security-Policy trebuie ADAPTAT aplicației tale (script-src/style-src etc.)
  # add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'" always;

  # (Dacă ai nevoie de CORS la edge-ul NGINX, configurează-l aici pe /api,
  #  dar ideal rămâi pe un singur origin și nu ai nevoie.)
}
