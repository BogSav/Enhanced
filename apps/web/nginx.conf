################################################################################
# Enhanced Platform - Base Nginx Configuration (Global Layer)
# ------------------------------------------------------------------------------
#
# Nginx is used for local production testing. We first build the project
# using vite and then serve the built static files with nginx.
#
# Responsibilities:
#  - Define core HTTP behavior (performance primitives, logging format, gzip).
#  - Declare shared memory zones for rate limiting & connection limiting.
#  - (Optionally) micro-caching primitives (commented out until needed).
#  - Include per-site / app server blocks from conf.d/*.conf.
#
# Activation vs Definition:
#  - limit_req_zone / limit_conn_zone here only define the counters.
#  - Actual enforcement happens where 'limit_req' or 'limit_conn' appears
#    (now enabled inside the app server in nginx.app.conf).
#
# Deployment Notes:
#  - Tune rate limits cautiously; a single SPA load can trigger many parallel
#    asset requests. Keep API throttling scoped to /api where possible.
#  - Connection limits protect against abusive long‑lived sockets but should
#    be high enough to avoid penalizing normal multi-tab usage.
#  - All logs stream to stdout/stderr for container aggregation (e.g. Docker,
#    Cloud provider log drains, or future OpenTelemetry edge ingestion).
#  - Keep this file minimal; app-specific policies belong in included confs.
################################################################################

user  nginx;                     # Runtime user (inside official nginx:alpine image)
worker_processes auto;           # Let Nginx decide optimal number (usually == vCPU count)

error_log  /dev/stderr warn;     # Container-friendly: warnings+ to stderr
pid        /var/run/nginx.pid;

events {
  worker_connections  4096;      # Max simultaneous connections per worker
}

http {
  # ---------------- MIME & Core Performance Primitives ----------------
  include       /etc/nginx/mime.types;  # Standard mime mapping
  default_type  application/octet-stream;

  sendfile        on;    # Kernel-level zero‑copy for static file sends
  tcp_nopush      on;    # Optimize packet batching for sendfile
  tcp_nodelay     on;    # Low latency for proxied/interactive traffic

  keepalive_timeout   65;      # Idle keep-alive connection timeout (secs)
  keepalive_requests  10000;   # Allow many requests per keep-alive socket

  server_tokens off;           # Hide Nginx version (minor fingerprint hardening)

  # ---------------- Structured Logging ----------------
  # Log format includes timing + forwarded info for future upstream proxy usage.
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for" "$host" '
                  '"$request_time" "$upstream_response_time"';
  access_log /dev/stdout main;  # Stream to container stdout

  # ---------------- Basic Compression ----------------
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_vary on;   # Respect/emit Vary: Accept-Encoding

  # ---------------- Rate & Connection Limiting (Zone Definitions) ----------------
  # Updated to 25r/s to better accommodate initial asset bursts while still
  # protecting future API endpoints. Adjust downward if API endpoints are more
  # sensitive.
  limit_req_zone  $binary_remote_addr  zone=api_rate:10m  rate=25r/s;
  # Concurrent connection caps (per IP + per server hostname)
  limit_conn_zone $binary_remote_addr  zone=perip:10m;
  limit_conn_zone $server_name         zone=perserver:10m;

  # ---------------- Optional Micro-Caching (Disabled) ----------------
  # Uncomment & reference via proxy_cache / proxy_cache_valid in location blocks
  # proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=api_cache:64m \
  #                  max_size=512m inactive=10m use_temp_path=off;

  # Load site / app specific server configurations
  include /etc/nginx/conf.d/*.conf;
}