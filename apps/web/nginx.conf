user  nginx;
worker_processes auto;

error_log  /dev/stderr warn;
pid        /var/run/nginx.pid;

events {
  worker_connections  4096;
}

http {
  # tipuri MIME + bazele performanței
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;

  keepalive_timeout   65;
  keepalive_requests  10000;

  server_tokens off;  # nu afișa versiunea

  # logging către stdout/stderr în containere
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for" "$host" '
                  '"$request_time" "$upstream_response_time"';
  access_log /dev/stdout main;

  # compresie de bază
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_vary on;

  # --- Rate limiting & connection limiting (definite la nivel http) ---
  # 10 requests/sec per IP pe /api (ajustabil)
  limit_req_zone  $binary_remote_addr  zone=api_rate:10m  rate=10r/s;

  # limite conexiuni concurente (per IP și per server)
  limit_conn_zone $binary_remote_addr  zone=perip:10m;
  limit_conn_zone $server_name         zone=perserver:10m;

  # (OPȚIONAL) micro-caching pentru GET/HEAD API (dezactivat by default):
  # proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=api_cache:64m
  #                  max_size=512m inactive=10m use_temp_path=off;

  include /etc/nginx/conf.d/*.conf;
}